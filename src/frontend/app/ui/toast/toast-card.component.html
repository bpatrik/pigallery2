<ng-icon class="toast-icon text-{{ color() }}" [name]="icon()"/>
<div class="toast-content">
  <div class="toast-title"><ng-content select="[toastTitle]"/></div>
  <div class="toast-text"><ng-content/></div>
</div>
<ng-content select="[toastAction]"/>
@if (countdown()) {
  <div class="toast-bar countdown bg-{{ color() }}" [style.animation-duration.ms]="countdown()"></div>
} @else if (progress() !== null) {
  <div class="toast-bar bg-{{ color() }}" [style.width.%]="progress()"></div>
}
