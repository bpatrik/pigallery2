<app-gallery-search-field-base [(ngModel)]="rawSearchText" [ngModelOptions]="{standalone: true}"
                               (ngModelChange)="validateRawSearchText()"
                               (searchSubmit)="searchSubmit.emit()"
                               [placeholder]="placeholder()"
                               class="rounded-2"
                               name="form-search-field" />
<hr>
<app-gallery-search-query-entry [(ngModel)]="searchQueryDTO" [ngModelOptions]="{standalone: true}"
  (change)="onChange()"
  (ngModelChange)="onChange()"
  name="search-root"
  (delete)="resetQuery()" />
