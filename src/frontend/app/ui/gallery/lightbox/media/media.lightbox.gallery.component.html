<div class="imgContainer" #imgContainer>
  @for (item of mediaItems(); track item.key) {
    @if (showThumbnail()) {
      <img [alt]="gridMedia()?.media.name"
        [style.width.%]="imageSize().width"
        [style.height.%]="imageSize().height"
        [style.transform]="imageTransform()"
        [src]="thumbnailSrc()"/>
    }

    @if (isPhoto() && photoSrc()) {
      <img
        [style.width.%]="imageSize().width"
        [style.height.%]="imageSize().height"
        [style.transform]="imageTransform()"
        [src]="photoSrc()"
        [alt]="gridMedia()?.media?.name"
        (load)="onImageLoad()"
        (error)="onImageError()"
        #image/>
    }

    @if (isLivePhoto() && loadMedia() && liveVideoSrc()) {
      <div
        class="live-photo-container"
        [class.playing]="liveVideoPlaying()">
        <video [style.width.%]="imageSize().width"
          [style.height.%]="imageSize().height"
          [style.transform]="imageTransform()"
          [loop]="true"
          [muted]="true"
          playsinline
          (error)="onImageError()"
          #liveVideo>
          <source [src]="liveVideoSrc()" (error)="onSourceError()">
        </video>
        <button type="button" class="live-photo-badge"
          [class.active]="liveVideoPlaying()"
          (mouseenter)="startLiveVideo()"
          (mouseleave)="stopLiveVideo()"
          (touchstart)="startLiveVideoTouch()"
          (touchend)="stopLiveVideo()"
          (touchcancel)="stopLiveVideo()"
          (click)="toggleLiveVideo()">
          LIVE
        </button>
      </div>
    }

    @if (isVideo() && loadMedia()) {
      <video
        [style.width.%]="imageSize().width"
        [style.height.%]="imageSize().height"
        (loadstart)="onImageLoad()"
        [loop]="lightboxService.loopVideos()"
        autoplay
        (error)="onImageError()"
        (timeupdate)="onVideoProgress()"
        (play)="onVideoStateChange()"
        (pause)="onVideoStateChange()"
        (volumechange)="onVideoStateChange()"
        #video>
        <source [src]="bestFitVideoPath()" (error)="onSourceError()">
        Something went wrong.
      </video>
    }
  }
</div>
