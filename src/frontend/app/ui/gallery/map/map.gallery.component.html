<app-gallery-map-lightbox [photos]="photos()" [gpxFiles]="gpxFiles()" [getParentDimension]="getDimension" />
<div class="clickable"
     style="border-radius: inherit"
     id="map" #map>
  <div
    class="leaflet-map"
    style="border-radius: inherit"
    leaflet
    [leafletOptions]="options"
    [leafletLayers]="markerLayer()"
    (leafletMapReady)="onMapReady($event)">
  </div>
  <button type="button" class="overlay" (click)="click()" aria-label="Open the map" i18n-aria-label></button>
</div>
