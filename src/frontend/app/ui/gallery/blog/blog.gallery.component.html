@if (mkObservable | async; as markdowns) {
  @if (markdowns.length > 0) {
    <div class="blog h-100">
      <div class="card h-100">
        <div class="card-body" style="min-height: 77px" [style.height]="!open ? '77px':''">
          @for (md of markdowns; track md; let last = $last; let first = $first) {
            @if (open) {
              @if (markdowns.length > 1) {
                <div class="row">
                  <hr class="col">
                  <div class="col-auto small fst-italic">{{md.file | toRelativePath}}</div>
                </div>
              }
              <markdown
                [data]="md.text">
              </markdown>
            }
            @if (!open && first) {
              <span class="text-preview">
                <markdown
                  [inline]="true"
                  [data]="md.textShort">
                </markdown>
              </span>
            }
          }
        </div>
      </div>
      <button class="btn btn-blog-details text-body" (click)="toggleCollapsed()">
        <ng-icon [name]="open ? 'ionChevronUpOutline' : 'ionChevronDownOutline'"></ng-icon>
      </button>
    </div>
  }
}
