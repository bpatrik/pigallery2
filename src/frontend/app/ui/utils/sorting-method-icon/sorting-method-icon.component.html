
@switch (method()) {
  @case (GroupSortByTypes.Name) {
    <ng-icon name="ionTextOutline" />
  }
  @case (GroupSortByTypes.Rating) {
    <ng-icon name="ionStarOutline" />
  }
  @case (GroupSortByTypes.Date) {
    <ng-icon name="ionCalendarOutline" />
  }
  @case (GroupSortByTypes.PersonCount) {
    <ng-icon name="ionPersonOutline" />
  }
  @case (GroupSortByTypes.Random) {
    <ng-icon name="ionShuffleOutline" />
  }
  @case (GroupSortByTypes.FileSize) {
    <ng-icon name="ionDocumentOutline" />
  }
  @case (GroupSortByTypes.NoGrouping) {
    <ng-icon name="ionCloseOutline" />
  }
}
