<app-frame>

  <app-faces-navbar navbar-appendix />

  <div body #container class="container-fluid">
    @for (person of favourites(); track person.id) {
      <app-face [person]="person"
      [size]="size" />
    }
    @if (nonFavourites().length > 0) {
      <hr/>
    }
    @for (person of nonFavourites(); track person.id) {
      <app-face [person]="person"
      [size]="size" />
    }

    @if (nonFavourites().length === 0 && favourites().length === 0) {
      <div class="d-flex no-face-msg"
        >
        <div class="flex-fill">
          <h2>:(
            <ng-container i18n>No faces to show.</ng-container>
          </h2>
        </div>
      </div>
    }
  </div>
</app-frame>
