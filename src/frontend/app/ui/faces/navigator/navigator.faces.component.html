<div class="container-fluid pt-1 pb-1 pe-0 ps-0 bg-body-secondary">
  <nav class="d-md-flex row" aria-label="breadcrumb">
    <div class="col-auto">
      <ol class="mb-0 mt-1 breadcrumb">
        <li class="breadcrumb-item">
          <ng-container i18n>Faces</ng-container>
        </li>
      </ol>
    </div>
    <div class="ms-auto text-end col-auto">
      <div class="btn-group" dropdown #dropdown="bs-dropdown" placement="bottom right"
        [insideClick]="true"
        title="Sort" i18n-title>
        <button id="button-alignment" dropdownToggle type="button"
          class="btn dropdown-toggle  btn-outline-secondary btn-navigator"
          [class.btn-secondary]="!isDefaultSorting()"
          [class.btn-outline-secondary]="isDefaultSorting()"
          aria-controls="sorting-dropdown">
          <ng-icon [name]="!facesService.sorting().ascending ? 'ionArrowDownOutline' : 'ionArrowUpOutline'" />
          <app-sorting-method-icon [method]="facesService.sorting().method" />
        </button>
        <div id="sorting-dropdown" *dropdownMenu class="dropdown-menu dropdown-menu-right"
          role="menu" aria-labelledby="button-alignment">
          <div class="row flex-nowrap">
            <div class="col p-1">
              <h6 class="ps-2"><ng-container i18n>Sorting</ng-container></h6>
              <div class="row">
                @for (type of sortingByTypes; track type) {
                  <button type="button" class="dropdown-item sorting-item ps-3 pe-3" role="menuitem"
                    [class.active]="facesService.sorting().method === type.key"
                    (click)="setSortingBy(type.key)">
                    <span class="me-2 d-inline-block">
                      <app-sorting-method-icon [method]="type.key" />
                    </span>
                    <span class="d-inline-block">{{type.key | stringifySorting}}</span>
                  </button>
                }

                <hr>
                  <button type="button" class="dropdown-item sorting-item ps-3 pe-3" role="menuitem"
                    [class.active]="facesService.sorting().ascending === true"
                    (click)="setSortingAscending(true)">
                    <span class="me-2 d-inline-block">
                      <ng-icon name="ionArrowUpOutline" />
                    </span>
                    <span class="d-inline-block" i18n>ascending</span>
                  </button>

                  <button type="button" class="dropdown-item sorting-item ps-3 pe-3" role="menuitem"
                    [class.active]="facesService.sorting().ascending === false"
                    (click)="setSortingAscending(false)">
                    <span class="me-2 d-inline-block">
                      <ng-icon name="ionArrowDownOutline" />
                    </span>
                    <span class="d-inline-block" i18n>descending</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </div>
