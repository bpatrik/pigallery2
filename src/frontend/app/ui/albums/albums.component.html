<app-frame>

  <div body #container class="container-fluid">
    @for (album of albumsService.albums(); track album.id) {
      <app-album [album]="album"
      [size]="size()" />
    }

    <!-- before the button: the absolutely positioned button starts below it -->
    @if (albumsService.albums()?.length === 0) {
      <app-empty-state class="no-item-msg" icon="ionAlbumsOutline">
        <ng-container i18n>No albums yet.</ng-container>
        <span hint i18n>Search for something, then save the search as an album with the save button next to the search bar.</span>
      </app-empty-state>
    }

    @if (CanCreateAlbum) {
      <button type="button" class="add-saved-search btn btn-secondary"
        [style.width.px]="size()"
        [style.height.px]="size()"
        (click)="openModal(modal)">
        <span class="text d-block">
          <ng-icon name="ionAddOutline" class="mb-2" />
          <span i18n>Add saved search</span>
        </span>
      </button>
    }
  </div>
</app-frame>


<ng-template #modal>
  <!-- sharing Modal-->
  <div class="modal-header">
    <h5 class="modal-title" i18n>Add saved search</h5>
    <button type="button"  class="btn-close"  (click)="hideModal()" data-dismiss="modal" aria-label="Close">
    </button>
  </div>
  <div class="modal-body">
    <form #savedSearchPanelForm="ngForm" class="form-horizontal">
      <div class="mb-1">
        <label for="saveSearchName">Album name</label>
        <input
          id="saveSearchName"
          name="saveSearchName"
          placeholder="Album name"
          class="form-control input-md"
          required="required"
          [(ngModel)]="savedSearch.name"
          type="text"/>
      </div>
      <div class="mb-1">
        <label for="album-search-query-builder">Search query</label>
        <app-gallery-search-query-builder id="album-search-query-builder"
          name="album-search-query-builder"
          [(ngModel)]="savedSearch.searchQuery" />
      </div>


      <div class="input-group-btn float-end" style="display: block">
        <app-saved-search-popup-btn [disabled]="IsSearchQueryEmpty"
          class="me-2"
          [savedSearchDTO]="savedSearch" />
        <button class="btn btn-primary" type="button"
          [disabled]="IsSearchQueryEmpty"
          (click)="saveSearch()">
          <ng-icon name="ionSaveOutline" class="me-1" /><span i18n>Save</span>
        </button>
      </div>
    </form>
  </div>
</ng-template>
