<a [routerLink]="routerLink()"
  style="display: inline-block;">


  <div class="photo-container  rounded overflow-hidden"
    [style.width.px]="size()"
    [style.height.px]="size()">

    @if (thumbnail && thumbnail.Available) {
      <div class="photo "
      [style.background-image]="thumbnail.Src | cssUrl"></div>
    }

    @if (!thumbnail || !thumbnail.Available) {
      <app-icon class="no-image" />
    }
  </div>


  <!--Info box -->
  <div class="info rounded-bottom">
    {{album().name}} ({{album().cache?.itemCount}})
    @if (canUpdate() && !album().locked) {
      <ng-icon (click)="askDelete($event, deleteConfirm)"
        class="info-button delete float-end"
        name="ionTrashOutline"
      title="Delete" i18n-title />
    }

    @if (album().locked) {
      <ng-icon class="info-button float-end"
        name="ionLockClosedOutline"
        title="Album is locked, cannot be deleted from the webpage."
      i18n-title />
    }

  </div>
</a>

<ng-template #deleteConfirm>
  <div class="modal-header">
    <h5 class="modal-title" i18n>Delete album</h5>
    <button type="button" class="btn-close" (click)="hideModal()" aria-label="Close" i18n-aria-label></button>
  </div>
  <div class="modal-body" i18n>Delete the album "{{album().name}}"? Only the album is deleted, its photos stay.</div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="hideModal()" i18n>Cancel</button>
    <button type="button" class="btn btn-danger" (click)="deleteAlbum()" i18n>Delete</button>
  </div>
</ng-template>
