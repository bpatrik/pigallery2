<div class="photo-container">
  <ng-template #popTemplate>
    @if (thumbnail.Available) {
      <img alt="{{media.name}}"
        class="big-icon"
        [src]="thumbnail.Src"
        >
    }
  </ng-template>

  @if (thumbnail.Available) {
    <img alt="{{media.name}}"
      class="icon"
      [popover]="popTemplate"
      container="body"
      triggers="mouseenter:mouseleave"
      [src]="thumbnail.Src"
      >
  }

</div>
