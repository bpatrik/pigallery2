name: Docker rebuild
# Releases are rare, but the base images (OS packages, Node) get security fixes all the time.
# This rebuilds the latest release's images on fresh base images and overwrites its tags,
# like the official node images do. The app is the release's own zip, unchanged
# (its package-lock.json pins the npm packages), with the Dockerfiles of its tag.
on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

  rebuild-docker:
    runs-on: ubuntu-latest
    needs: [latest-release]
    # a hanging build would otherwise take 6 hours
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        container: [alpine, debian-trixie]
        include:
          - container: alpine
            platforms: linux/amd64,linux/arm64
          - container: debian-trixie
            platforms: linux/amd64,linux/arm64
    env:
      TAG: ${{ needs.latest-release.outputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Download the release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern pigallery2-release.zip
          unzip -q pigallery2-release.zip -d pigallery2-release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # The build runs the app's diagnostics (e.g. the sharp check), so a broken image fails here
      # and nothing is pushed: buildx pushes only after every platform built.
      - name: Rebuild and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: ${{ matrix.platforms }}
          push: true
          # no cache: a cached layer would keep the old OS packages
          no-cache: true
          pull: true
          # the release's tags, without edge-*: those follow master
          tags: |
            ${{ matrix.container == 'debian-trixie' && format('{0}/pigallery2:{1},{0}/pigallery2:latest', secrets.REGISTRY_NAMESPACE, env.TAG) || '' }}
            ${{ matrix.container != 'debian-trixie' && format('{0}/pigallery2:{1}-{2},{0}/pigallery2:latest-{2}', secrets.REGISTRY_NAMESPACE, env.TAG, matrix.container) || '' }}
