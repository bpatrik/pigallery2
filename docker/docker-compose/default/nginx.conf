events {

}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		text/css
		text/plain
		text/javascript
		text/markdown
		application/javascript
		application/json
		application/gpx+xml
		application/x-javascript
		application/xml
		application/xml+rss
		application/xhtml+xml
		application/x-font-ttf
		application/x-font-opentype
		application/vnd.ms-fontobject
		image/svg+xml
		image/x-icon
		application/rss+xml
		application/atom_xml;
  gzip_disable "MSIE [1-6]\.(?!.*SV1)";


	##
	# Rate limiting
	##
	# PiGallery2 does not limit the request rate itself, it relies on the reverse proxy for that.
	# The limits are per client IP. Raise them if many users share one IP (e.g. an office behind a NAT).

	# login attempts (password guessing): 1 per second on average
	limit_req_zone $binary_remote_addr zone=pigallery2_login:10m rate=1r/s;
	# everything else of the API. Opening a folder loads many thumbnails at once, so keep it generous.
	limit_req_zone $binary_remote_addr zone=pigallery2_api:10m rate=50r/s;
	limit_req_status 429;

	##
	# Virtual Host Configs
	##

   server {
  	listen 80 default_server;
  	listen [::]:80 default_server;

  	server_name yourdomain.com www.yourdomain.com; # CHANGE ME
  	return 301 https://$server_name$request_uri;
  }

  server {
    server_name yourdomain.com;  # CHANGE ME


    # Login of users and of password protected sharings: limited strictly to slow down password guessing.
    # NOTE: change '/pgapi' here too if you changed Server.apiPath or Server.urlBase.
    location ~ ^/pgapi/(user|share)/login/?$ {
      limit_req zone=pigallery2_login burst=10 nodelay;
      proxy_pass http://pigallery2:80; # forwarding to the other container, named 'pigallery2'
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Only allow all methods (GET,POST,PUT,etc..) for root (/pgapi).
    # see https://github.com/bpatrik/pigallery2/issues/214
    location /pgapi { # NOTE: no ending '/' as it would forward /pgapi to /
      # uploads: keep client_max_body_size at least Upload.maxFileSizeMB of the gallery (default 500 MB),
      # nginx's own default is 1 MB. Without request buffering nginx doesn't store the whole file first.
      client_max_body_size 500m;
      proxy_request_buffering off;
      limit_req zone=pigallery2_api burst=500 nodelay;
      proxy_pass http://pigallery2:80; # forwarding to the other container, named 'pigallery2'
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location / {
      limit_except GET {
        deny  all;
      }
      proxy_pass http://pigallery2:80; # forwarding to the other container, named 'pigallery2'
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem; # CHANGE ME
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem; # CHANGE ME
    include /etc/letsencrypt/options-ssl-nginx.conf;
  }
}
